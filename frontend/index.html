        <p style="color: #8a8c92; font-size: 0.95rem; margin-bottom: 1.5rem;">Autonomous Web Research &amp; Source Verification Workbench</p>

        <h2 style="color: #ffffff; font-size: 1.15rem; margin-top: 1.25rem;">About the System</h2>
        <p>The Multi-Agent Research Assistant is an automated intelligence system powered by LangGraph, FastAPI, and Redis. It orchestrates a coordinated team of specialized AI agents to execute deep, fact-checked research on any topic:</p>

        <ul style="margin: 1rem 0; padding-left: 1.5rem; color: #b5b8be;">
          <li><strong>Planner Specialist:</strong> Formulates targeted sub-questions and systematic search queries based on the research query and selected focus mode.</li>
          <li><strong>Researcher Specialists:</strong> Fan out concurrently to search the web, scrape source articles, unblock bot-defended pages, and extract grounded evidence snippets.</li>
          <li><strong>Reviewer Specialist:</strong> Audits collected findings against research objectives, detects knowledge gaps, and triggers iterative gap-filling cycles.</li>
          <li><strong>Writer Specialist:</strong> Synthesizes validated findings into an executive summary and detailed thematic sections with deterministic inline citation markers.</li>
          <li><strong>Citation &amp; Provenance Validator:</strong> Enforces pre-flight URL verification, W3C text-fragment deep anchor linking, and verbatim quote verification before report delivery.</li>
        </ul>

        <h2 style="color: #ffffff; font-size: 1.15rem; margin-top: 1.25rem;">Supported Focus Modes</h2>
        <p>General Web, Academic &amp; Scientific Literature, Technical &amp; Engineering Documentation, and Financial &amp; Market Intelligence.</p>

        <p style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #222224; color: #8a8c92; font-size: 0.85rem;">
          JavaScript is required to operate the interactive real-time research dashboard, monitor live DAG execution, and review plans with Human-in-the-Loop controls.
        </p>
